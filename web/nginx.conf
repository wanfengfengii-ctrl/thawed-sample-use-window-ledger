server {
    # Bind both IPv4 and IPv6: container health checks may resolve localhost
    # to ::1 (busybox wget does not fall back to IPv4 after an IPv6 refusal).
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API; the browser never needs CORS in Compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
